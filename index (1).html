<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>A question for you</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@600;800&display=swap">
<style>
:root{--fg:#5d4380;--ac:#b48be6;--orchid:#c9d2ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,#fff 0%,#ffe9f2 35%,#e9e4ff 70%,var(--orchid) 100%);color:var(--fg);font-family:Nunito,Arial,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;touch-action:manipulation}
main{padding:24px;max-width:560px;position:relative;z-index:2}
h1{font-family:Caveat,Georgia,serif;font-size:clamp(44px,12vw,72px);line-height:1.05;margin:.15em 0 .25em;font-weight:700}
p{font-size:18px;margin:0 0 20px;opacity:.85}
.big{font-size:54px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
.row{display:flex;gap:16px;justify-content:center;align-items:center;min-height:64px}
#hint{min-height:26px;font-size:16px;margin:14px 0 0;opacity:.8}
button{font:800 18px Nunito,Arial,sans-serif;border:0;border-radius:999px;padding:15px 34px;cursor:pointer;transition:transform .35s,opacity .3s,left .35s,top .35s}
#yes{background:var(--ac);color:#fff;box-shadow:0 8px 22px rgba(180,139,230,.4)}
#no{background:#fff;color:var(--fg);border:2px solid #d9c9f3;z-index:5}
#no.gone{opacity:0;transform:scale(.2) rotate(20deg);pointer-events:none}
.fl,.pop{position:fixed;pointer-events:none;z-index:1;user-select:none}
.fl{bottom:-50px;animation:up linear forwards}
@keyframes up{to{transform:translateY(-115vh) rotate(40deg)}}
.pop{z-index:6;animation:pop 1.1s ease-out forwards}
@keyframes pop{0%{transform:translate(0,0) scale(.2);opacity:1}60%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(40deg);opacity:0}}
#done{display:none}
@media (prefers-reduced-motion:reduce){.fl,.big{animation:none}}
</style></head><body>
<main id="ask"><div class="big">🌷</div><h1>Will you go on a date with me?</h1><p>Tomorrow. Just the two of us 💕</p>
<div class="row"><button id="yes">Yes</button><button id="no">No</button></div><div id="hint"></div></main>
<main id="done"><div class="big">💐</div><h1>It’s a date!</h1><p>Tomorrow. I can’t wait to see you 💜</p></main>
<script>
var E=['🌸','🌷','🌺','💐','🌼','💗','💕','💜','🦋','🌹','✨','💖'];
function r(a){return a[Math.floor(Math.random()*a.length)]}
function fl(){var s=document.createElement('span');s.className='fl';s.textContent=r(E);s.style.left=Math.random()*94+'vw';s.style.fontSize=(20+Math.random()*26)+'px';s.style.animationDuration=(6+Math.random()*6)+'s';document.body.appendChild(s);setTimeout(function(){s.remove()},12500)}
function burst(x,y,n){for(var i=0;i<n;i++){var s=document.createElement('span');s.className='pop';s.textContent=r(E);s.style.left=x+'px';s.style.top=y+'px';s.style.fontSize=(22+Math.random()*20)+'px';var a=Math.random()*6.28,d=60+Math.random()*110;s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d-40+'px');document.body.appendChild(s);setTimeout(function(q){q.remove()},1200,s)}}
var PC=['#ffcfe0','#e4d6fb','#f3e5d0','#fff4df','#cfe2ff','#ffdbe8'];
function svgF(c){var t='';for(var i=0;i<5;i++)t+=`<ellipse cx="20" cy="10" rx="6.5" ry="10" transform="rotate(${i*72} 20 20)" fill="${c}"/>`;return `<svg viewBox="0 0 40 40" width="100%" height="100%" style="filter:drop-shadow(0 1px 2px rgba(120,90,150,.35))">${t}<circle cx="20" cy="20" r="4" fill="#fff7e0"/></svg>`}
function svgH(c){return `<svg viewBox="0 0 32 32" width="100%" height="100%" style="filter:drop-shadow(0 1px 2px rgba(120,90,150,.35))"><path d="M16 28C4 19 3 11 8 7c4-3 7 0 8 3 1-3 4-6 8-3 5 4 4 12-8 21z" fill="${c}"/></svg>`}
function pc(){var c=PC[Math.floor(Math.random()*PC.length)];return Math.random()<.3?svgH(c):svgF(c)}
function pastel(x,y,n,dist){for(var i=0;i<n;i++){var s=document.createElement('span'),z=22+Math.random()*34;s.className='pop';s.innerHTML=pc();s.style.cssText='left:'+x+'px;top:'+y+'px;width:'+z+'px;height:'+z+'px';var a=Math.random()*6.28,d=dist*(.3+Math.random()*.7);s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');s.style.animationDuration=(1.2+Math.random()*.9)+'s';document.body.appendChild(s);setTimeout(function(q){q.remove()},2300,s)}}
function pfall(){var s=document.createElement('span'),z=20+Math.random()*28;s.className='fl';s.innerHTML=pc();s.style.cssText='left:'+Math.random()*94+'vw;width:'+z+'px;height:'+z+'px;animation-duration:'+(6+Math.random()*5)+'s';document.body.appendChild(s);setTimeout(function(){s.remove()},11500)}
setInterval(function(){if(!document.hidden&&!window.cel)fl()},350);
document.addEventListener('pointerdown',function(e){if(window.cel)pastel(e.clientX,e.clientY,8,120);else burst(e.clientX,e.clientY,6)});
var yes=document.getElementById('yes'),no=document.getElementById('no'),hint=document.getElementById('hint');
var tries=0,last=0,msgs=['Say yes and I’ll be on my best behaviour 🥺','Let me take you out, pretty 🌸','You can’t run from this smile, pretty 😄','Let’s go na, pretty, hey 💗','Your dream boy is waiting, don’t make him wait 😌💐'];
function dodge(e){
  var t=Date.now();if(t-last<500||no.classList.contains('gone'))return;last=t;
  if(e.cancelable)e.preventDefault();
  tries++;hint.textContent=msgs[tries-1]||'';
  var b=no.getBoundingClientRect();burst(b.left+b.width/2,b.top+b.height/2,8);
  if(tries>=5){no.classList.add('gone');yes.style.transform='scale(1.3)';return}
  no.style.position='fixed';
  var h=hint.getBoundingClientRect(),y=yes.getBoundingClientRect(),L,T,k=0;
  function hit(a,m){return L<a.right+m&&L+b.width>a.left-m&&T<a.bottom+m&&T+b.height>a.top-m}
  do{L=Math.max(8,Math.random()*(innerWidth-b.width-16));T=Math.max(8,Math.random()*(innerHeight-b.height-16));k++}while(k<60&&(hit(h,50)||hit(y,60)));
  no.style.left=L+'px';no.style.top=T+'px';
  yes.style.transform='scale('+(1+tries*.06)+')';
}
no.addEventListener('pointerenter',function(e){if(e.pointerType==='mouse')dodge(e)});
no.addEventListener('pointerdown',dodge,{passive:false});
no.addEventListener('click',function(e){e.preventDefault();e.stopPropagation()});
yes.addEventListener('click',function(e){
  document.getElementById('ask').style.display='none';document.getElementById('done').style.display='block';
  if(no.parentNode)no.remove();
  window.cel=true;document.querySelectorAll('.fl').forEach(function(q){q.remove()});
  pastel(innerWidth/2,innerHeight/2,110,Math.max(innerWidth,innerHeight)*.6);
  var i=0,iv=setInterval(function(){pastel(Math.random()*innerWidth,Math.random()*innerHeight,14,160);if(++i>12)clearInterval(iv)},300);
  setInterval(pfall,140);
});
</script></body></html>
